name: Session file recovery tests

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/session-file-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy "Pillow>=11"
      - run: python -m unittest discover -s server/tests -p test_staging.py -v
      - run: python -m unittest discover -s server/tests -p test_heightmap.py -v
