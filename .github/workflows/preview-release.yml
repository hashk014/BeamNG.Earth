name: Build Windows preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft preview release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:PREVIEW_TAG -cne "v$version") { throw "Tag does not match VERSION" }
          $release = gh release view $env:PREVIEW_TAG --json isDraft,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Draft release is missing" }
          if (-not $release.isDraft) { throw "Only draft releases can receive preview builds" }
          $target = git rev-parse "$($release.targetCommitish)^{commit}"
          if ($target.Trim() -cne $env:GITHUB_SHA) { throw "Release target differs from this build" }
      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.22.3 -r server/requirements.txt
      - name: Build native kernels
        run: python tools/build_native.py
      - name: Build bootloader from source
        run: python tools/build_bootloader.py
      - name: Build Windows executable
        run: python tools/build_app.py --require-own-bootloader
      - name: Check packaged server startup
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -LiteralPath dist -Filter '*.exe')
          if ($exes.Count -ne 1) { throw "Expected one Windows executable" }
          $exe = $exes[0]
          & $exe.FullName --server --help | Out-File -LiteralPath packaged-server-help.txt
          if ($LASTEXITCODE -ne 0) { throw "Packaged server startup failed" }
          if (-not (Select-String -LiteralPath packaged-server-help.txt -Pattern 'earthd|--user-dir' -Quiet)) {
            throw "Packaged server did not print its command-line help"
          }
      - name: Upload executable to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ inputs.tag }}
        run: |
          $exes = @(Get-ChildItem -LiteralPath dist -Filter '*.exe')
          if ($exes.Count -ne 1) { throw "Expected one Windows executable" }
          gh release upload $env:PREVIEW_TAG $exes[0].FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview-check
          path: packaged-server-help.txt
