name: Launcher compatibility tests

on:
  pull_request:
    paths:
      - "launcher.py"
      - "install.py"
      - "server/tests/test_launcher_compat.py"
      - ".github/workflows/launcher-compat-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s server/tests -p test_launcher_compat.py -v
