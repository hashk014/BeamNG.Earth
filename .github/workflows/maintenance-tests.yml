name: Fork maintenance checks

on:
  pull_request:
    branches: [preview]
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --only-binary=duckdb -r requirements-dev.txt
      - run: python tools/maintenance.py test --suite quick --report dist/quick-validation.json
      - run: python tools/maintenance.py test --suite generators --report dist/generator-validation.json
      - run: python tools/run_lua_tests.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node mod/tests/test_mapmath.mjs
      - run: node server/tests/test_mapmath.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-validation-${{ matrix.os }}
          path: dist/*validation.json
