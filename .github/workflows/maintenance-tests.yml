name: Fork maintenance checks

on:
  pull_request:
    branches: [preview]
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.12"
      - run: python -m pip install --only-binary=duckdb -r requirements-dev.txt
      - run: python tools/maintenance.py test --suite quick --report dist/quick-validation.json
      - run: python tools/maintenance.py test --suite generators --report dist/generator-validation.json
      - run: python tools/maintenance.py test --suite integration --report dist/integration-validation.json
      - run: python tools/run_lua_tests.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: "22"
      - run: node mod/tests/test_mapmath.mjs
      - run: node server/tests/test_mapmath.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: maintenance-validation-${{ matrix.os }}
          path: dist/*validation.json
